requires = ["tox>=4.52"]
env_list = ["3.13", "lint", "format", "build"]

[env_run_base]
description = "run the test suite with pytest"
package = "editable"
deps = [
    "pytest>=9",
    "pyfakefs",
]
commands = [
    ["pytest", "--basetemp={env_tmp_dir}", { replace = "posargs", default = ["tests"], extend = true }]
]

[env.lint]
description = "run linters"
deps = ["-rrequirements_dev.txt"]
commands = [
    ["ruff", "check", { replace = "posargs", default = ["."], extend = true }],
    ["pylint", { replace = "posargs", default = ["src"], extend = true }],
    ["mypy", "--strict", { replace = "posargs", default = ["src"], extend = true }],
]

[env.format]
description = "fix ruff issues and format the code"
deps = ["-rrequirements_dev.txt"]
commands = [
    ["ruff", "check", "--fix", { replace = "posargs", default = ["."], extend = true }],
    ["black", { replace = "posargs", default = ["src", "tests"], extend = true }],
]

[env.build]
description = "build source and wheel distributions"
package = "deps-only"
deps = ["build>=0.10"]
commands = [
    ["python", "-m", "build", "--sdist", "--wheel", "--outdir", "dist"]
]

[env.publish]
description = "build and publish the package via twine"
deps = ["build>=0.10", "twine>=4.0"]
passenv = ["TWINE_USERNAME", "TWINE_PASSWORD", "TWINE_REPOSITORY_URL", "TWINE_NON_INTERACTIVE"]
commands = [
    ["python", "-m", "build", "--sdist", "--wheel", "--outdir", "{envtmpdir}{/}dist"],
    ["python", "-m", "twine", "check", "{envtmpdir}{/}dist{/}*"],
    ["python", "-m", "twine", "upload", "{envtmpdir}{/}dist{/}*"],
]
